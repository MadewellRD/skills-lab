name: Validate release assets

# Dispatch-only meant nothing ran these checks unless a human remembered to. That is how
# the seven-of-twenty-one coverage gap in validate_release_assets.py survived: the gate
# existed, reported success, and was almost never invoked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-release-assets:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate SDLC suite layout
        run: python tools/validate_sdlc_suite.py

      - name: Validate release asset checksums
        run: python tools/validate_release_assets.py
